[package]
name = "mhgu-launcher"
version = "1.0.0"
description = "Monster Hunter Generations Ultimate Recomp launcher"
authors = ["MHGU Recomp project"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
