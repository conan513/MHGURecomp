name: Build MHGURecomp Runtime

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install launcher dependencies
        run: npm ci

      - name: Test launcher settings
        run: npm test

      - name: Prepare launcher assets
        run: npm run build:launcher

      - name: Test launcher backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            git
            python3
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator

      - name: Build launcher
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item src-tauri/target/release/mhgu-launcher.exe build/MHGU-Launcher.exe
          Copy-Item src-tauri/target/release/WebView2Loader.dll build/WebView2Loader.dll

      - name: Build mhgurecomp.exe
        shell: msys2 {0}
        run: |
          make -j2 build/mhgurecomp.exe bundle LAUNCHER_PREBUILT=1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHGURecomp-MHW-Controls-Windows
          path: |
            build/mhgurecomp.exe
            build/MHGU-Launcher.exe
            build/*.dll
